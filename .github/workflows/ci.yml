name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch supersedes the first; no point burning minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # ci, never install: install would silently resolve a different tree than the lock file names,
      # which is the whole point of committing one.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Includes the guard tests: version mirrors, release notes, the epoch tiling, the release-notes
      # bundle boundary and the no-fancy-dashes rule. A missed version bump fails here, not in a release.
      - name: Test
        run: npm test

      # Chromium only, and only what Playwright needs. --with-deps installs the system libraries the
      # runner lacks; without it the browser launches and immediately dies with a missing .so.
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      # The suite that needs real text measurement. CodeMirror decides what to render by measuring,
      # and jsdom has no geometry, so Live mode's rendered output can only be checked here.
      - name: Browser tests
        run: npm run test:browser
