name: Desktop release

# Trypthos is a wholly local app: there is no server to redeploy, so a user only ever receives a
# change through a new installer. Cutting one is deliberate - push a v* tag on a green main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build renderer
        run: npm run build --workspace trypthos-app

      # Unsigned for now: SmartScreen warns on Windows, and macOS needs right-click then Open.
      # Developer ID signing and notarization are outstanding, and the README says so.
      # --publish always, not electron-builder's default. The default publishes only when it
      # recognises the build as tagged, which depends on how the runner reports the ref - and a
      # release that silently does not publish looks identical to one that did until someone goes
      # looking for the installer.
      - name: Package and publish
        run: npm run dist --workspace trypthos-desktop -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Kept alongside the release: the artifacts are how you retrieve a build whose publish step
      # failed, which is exactly when you most want them.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
          if-no-files-found: warn
