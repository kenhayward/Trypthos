name: Desktop release

# Trypthos is a wholly local app: there is no server to redeploy, so a user only ever receives a
# change through a new installer. Cutting one is deliberate - push a v* tag on a green main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Everything, not just the renderer. The shell requires @trypthos/domain at runtime and that
      # package is BUILT - building only the renderer left the shell importing a dist/ that the
      # runner had never produced.
      - name: Build
        run: npm run build

      # --publish never, deliberately. Letting each matrix job publish for itself is what produced
      # TWO draft releases for v0.4.2, with one asset stranded on the wrong one: both jobs finish at
      # roughly the same moment, each looks for a draft, neither sees the other's, and both create
      # one. Packaging fans out; publishing must not.
      #
      # Unsigned for now: SmartScreen warns on Windows, and macOS needs right-click then Open.
      - name: Package
        run: npm run dist --workspace trypthos-desktop -- --publish never

      # The failure this catches shipped in every release up to 0.8.0: the app packaged, published and
      # downloaded perfectly, and died on launch because a required module was never bundled. Reading
      # the asar is the cheapest way to assert that what main.js requires is actually in there.
      - name: Check the package contains what the shell requires
        shell: bash
        run: |
          asar=apps/desktop/release/*-unpacked/resources/app.asar
          [ -f $asar ] || asar=apps/desktop/release/mac*/Trypthos.app/Contents/Resources/app.asar
          echo "inspecting $asar"
          # Separator-agnostic: asar list prints backslashes on Windows and forward slashes on macOS,
          # so a forward-slash pattern silently fails the check on exactly one of the two runners.
          npx asar list $asar | tr '\' '/' > /tmp/asar.txt
          grep -q "node_modules/@trypthos/domain/dist/index.js" /tmp/asar.txt             || { echo "FAIL: @trypthos/domain is not in the package"; wc -l < /tmp/asar.txt; exit 1; }
          echo "ok: @trypthos/domain is packaged"

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest

    steps:
      # v8 fails the run on a digest mismatch rather than warning, which is the behaviour a release
      # wants: an installer that arrived corrupted stops the publish instead of being uploaded for
      # people to download. Both actions are pinned to the majors that default to Node 24 - v5 was
      # preliminary Node 24 support that still RAN on Node 20, so it would not have moved anything.
      - name: Collect installers
        uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - name: List what will be published
        run: ls -lh installers

      # One job, one release, every asset - so there is no window in which two writers race. Not a
      # draft: the tag was already the deliberate act, and a release nobody can download is not one.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trypthos ${GITHUB_REF_NAME#v}" \
            --notes "Installers for Windows and macOS. Builds are unsigned: Windows SmartScreen will warn on first install, and macOS needs right-click then Open. The macOS build is Apple Silicon only." \
            installers/*
