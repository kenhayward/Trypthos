name: Desktop release

# Trypthos is a wholly local app: there is no server to redeploy, so a user only ever receives a
# change through a new installer. Cutting one is deliberate - push a v* tag on a green main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build renderer
        run: npm run build --workspace trypthos-app

      # --publish never, deliberately. Letting each matrix job publish for itself is what produced
      # TWO draft releases for v0.4.2, with one asset stranded on the wrong one: both jobs finish at
      # roughly the same moment, each looks for a draft, neither sees the other's, and both create
      # one. Packaging fans out; publishing must not.
      #
      # Unsigned for now: SmartScreen warns on Windows, and macOS needs right-click then Open.
      - name: Package
        run: npm run dist --workspace trypthos-desktop -- --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Collect installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List what will be published
        run: ls -lh installers

      # One job, one release, every asset - so there is no window in which two writers race. Not a
      # draft: the tag was already the deliberate act, and a release nobody can download is not one.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trypthos ${GITHUB_REF_NAME#v}" \
            --notes "Installers for Windows and macOS. Builds are unsigned: Windows SmartScreen will warn on first install, and macOS needs right-click then Open. The macOS build is Apple Silicon only." \
            installers/*
